{% assign base_path = include.base_path | default: "" %}

<header id="navbar" class="navbar-container" role="banner">
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="navbar-content">
            <a href="/" class="navbar-brand" aria-label="Parth Ravrani - Home">
                <div class="navbar-logo">
                    <span class="navbar-logo-text">Parth Ravrani</span>
                    <span class="navbar-logo-subtitle">Senior .NET Developer</span>
                </div>
            </a>

            <div class="navbar-links" id="navbar-links">
                <a href="/" class="navbar-link {% if active_page == 'home' %}active{% endif %}">
                    <span>Home</span>
                </a>
                <a href="/portfolio/" class="navbar-link {% if active_page == 'portfolio' %}active{% endif %}">
                    <span>Work</span>
                </a>

            <a href="#contact" class="navbar-cta" aria-label="Contact">

            <button class="navbar-mobile-toggle" id="mobile-menu-toggle" aria-label="Toggle menu" aria-expanded="false">

                <span class="navbar-mobile-toggle-line"></span>

        </div>

        <div class="navbar-mobile-menu" id="mobile-menu">

                <a href="/" class="navbar-mobile-link {% if active_page == 'home' %}active{% endif %}">

                </a>
                <a href="/portfolio/" class="navbar-mobile-link {% if active_page == 'portfolio' %}active{% endif %}">
                    <span>Work</span>
                </a>
                <a href="/expertise/dotnet/" class="navbar-mobile-link {% if active_page == 'expertise' %}active{% endif %}">
                    <span>Expertise</span>

                <a href="#contact" class="navbar-mobile-cta">
